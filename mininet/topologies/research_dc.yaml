# IDN-System topology description — single source of truth.
#
# To use a different topology, copy this file and modify switches/hosts/links,
# then run:  python3 mininet/research_dc_topo.py --topo my_new_topo
#
# All derived configs (SWITCH_CONFIG, gateway interfaces, ARP proxy rules,
# default routes) are auto-generated by topo_loader.py.

name: research_dc
p4_pipeline: idn_basic

# Subnets define gateway addressing — each host references a subnet by name.
# The loader derives ONOS interface config and ARP proxy rules from these.
# Host-facing BMv2 ports are derived from link order by topo_loader.py.  Port
# numbers are 1-based everywhere (BMv2 chassis, ONOS connect points, probe API).
subnets:
  research:
    network: "192.168.10.0/24"
    gateway_ip: "192.168.10.1"
    gateway_mac: "02:aa:00:00:10:01"
  ai:
    network: "192.168.20.0/24"
    gateway_ip: "192.168.20.1"
    gateway_mac: "02:aa:00:00:20:01"
  dc:
    network: "10.0.0.0/24"
    gateway_ip: "10.0.0.1"
    gateway_mac: "02:aa:00:00:30:01"

# TCLink rejects rates above 1000 Mbps.  All capacities come from these
# profiles; the aggregation-to-access link is the controlled 100 Mbps
# bottleneck used by the competing-traffic QoS experiment.  It is the
# source-side shared uplink so h_research and h_video contend at the exact
# egress where HTB is installed.
link_profiles:
  default:
    bw_mbps: 1000
  bottleneck:
    bw_mbps: 100
  backup:
    bw_mbps: 100
    delay_ms: 5
default_link_profile: default

# Switch definitions — device_id maps to BMv2 gRPC port (50050 + id).
# The device_uri is auto-generated as "device:bmv2:{device_id}".
switches:
  - name: s_core1
    device_id: 1
    role: core
    router_mac: "02:aa:00:00:00:01"
  - name: s_core2
    device_id: 2
    role: core
    router_mac: "02:aa:00:00:00:02"
  - name: s_agg_r
    device_id: 3
    role: aggregation
    router_mac: "02:aa:00:00:00:03"
  - name: s_agg_d
    device_id: 4
    role: aggregation
    router_mac: "02:aa:00:00:00:04"
  - name: s_access_r
    device_id: 5
    role: access
    router_mac: "02:aa:00:00:00:05"
  - name: s_access_d
    device_id: 6
    role: access
    router_mac: "02:aa:00:00:00:06"

# Host definitions with subnet references.
hosts:
  - name: h_research
    ip: "192.168.10.10/24"
    mac: "02:00:00:00:00:11"
    subnet: research
  - name: h_video
    ip: "192.168.10.20/24"
    mac: "02:00:00:00:00:12"
    subnet: research
  - name: h_ai
    ip: "192.168.20.10/24"
    mac: "02:00:00:00:00:13"
    subnet: ai
  - name: h_dc
    ip: "10.0.0.10/24"
    mac: "02:00:00:00:00:14"
    subnet: dc
  - name: h_backup
    ip: "10.0.0.20/24"
    mac: "02:00:00:00:00:15"
    subnet: dc

# Links between nodes (switches and/or hosts).  The BMv2 port assignment
# follows interface creation order in Mininet — link order below determines
# Stratum/ONOS/P4Runtime port 1/2/3/… on each switch.
links:
  - { a: h_research, b: s_access_r, role: access, cost: 1 }
  - { a: h_video,    b: s_access_r, role: access, cost: 1 }
  - { a: h_ai,       b: s_agg_r,    role: access, cost: 1 }
  - { a: s_access_r, b: s_agg_r,    role: primary, cost: 1, profile: bottleneck }
  - { a: s_agg_r,    b: s_core1,    role: primary, cost: 1 }
  - { a: s_agg_r,    b: s_core2,    role: secondary, cost: 2 }
  - { a: s_core1,    b: s_core2,    role: core-peer, cost: 2 }
  - { a: s_core1,    b: s_agg_d,    role: primary, cost: 1 }
  - { a: s_core2,    b: s_agg_d,    role: secondary, cost: 2 }
  - { a: s_agg_d,    b: s_access_d, role: primary, cost: 1 }
  - { a: s_access_d, b: h_dc,       role: access, cost: 1 }
  - { a: s_access_d, b: h_backup,   role: access, cost: 1 }
  - { a: s_agg_r,    b: s_agg_d,    role: backup, cost: 50, profile: backup }
