server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every deployment must fetch a current HTML shell.  Hashed production
    # assets below are immutable and may be cached aggressively.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Vue Router history-mode fallback, including direct dashboard deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
